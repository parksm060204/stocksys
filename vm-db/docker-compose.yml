# 무명 거래소 — VM 자체 PostgreSQL + PostgREST 스택
# Ubuntu 22.04+ / Docker / Docker Compose

services:
  db:
    image: postgres:16-alpine
    container_name: moo_DB
    restart: unless-stopped
    command: >
      postgres
      -c max_wal_size=1GB
      -c min_wal_size=80MB
      -c checkpoint_timeout=15m
      -c autovacuum_vacuum_scale_factor=0.1
      -c autovacuum_analyze_scale_factor=0.05
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moo_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-moo}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:5432:5432"   # 로컬 전용. 외부 노출 금지
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
      - ./sql/runtime:/runtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moo_app} -d ${POSTGRES_DB:-moo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgREST: Postgres 를 REST API 로 노출 (Supabase SDK 호환)
  rest:
    image: postgrest/postgrest:v12.2.0
    container_name: moo_rest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-moo_app}:${POSTGRES_PASSWORD:-change_me_in_prod}@db:5432/${POSTGRES_DB:-moo}
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:-super_secret_jwt_change_me}
      PGRST_DB_USE_LEGACY_GUESSES: "false"
      PGRST_LOG_LEVEL: info
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx 역방향 프록시
  nginx:
    image: nginx:alpine
    container_name: moo_nginx
    restart: unless-stopped
    depends_on:
      - rest
    ports:
      - "0.0.0.0:3001:3000"    # 프론트/엔진이 접근할 REST API
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # 관리용 Adminer 웹 UI — http://VM_IP:8080
  adminer:
    image: adminer:4-standalone
    container_name: moo_adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "127.0.0.1:8080:8080"   # SSH 터널로만 접근 권장
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "1"